apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chernous-fp-django
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/chernous_fp_devops.git
    targetRevision: main
    path: charts/django-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true


