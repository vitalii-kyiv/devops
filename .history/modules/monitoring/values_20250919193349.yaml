# Custom values for kube-prometheus-stack
grafana:
  enabled: true
  adminPassword: "${GRAFANA_ADMIN_PASSWORD:-admin123}"
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false

prometheus:
  enabled: true
  service:
    type: ClusterIP
    port: 9090

alertmanager:
  enabled: true
  service:
    type: ClusterIP
    port: 9093

# Example custom dashboard
grafana:
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
